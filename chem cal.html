<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chem – cal</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#16302b;--muted:#5d7a73;--accent:#0f8b72;--accent2:#0b6b58;--border:#d5e3df;--ok:#e6f6f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1917;--card:#162623;--text:#e3f1ed;--muted:#8fb0a8;--accent:#2fc4a4;--accent2:#5fd8bd;--border:#2a403b;--ok:#193a33}}
:root[data-theme="dark"]{--bg:#0e1917;--card:#162623;--text:#e3f1ed;--muted:#8fb0a8;--accent:#2fc4a4;--accent2:#5fd8bd;--border:#2a403b;--ok:#193a33}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
h1{font-size:20px;margin:0}header p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.go:hover{background:var(--accent2)}
.res{margin-top:16px;background:var(--ok);border:1px solid var(--border);border-radius:10px;padding:14px;display:none}
.big{font-size:28px;font-weight:700;color:var(--accent2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;margin-left:6px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:#c0392b;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
td,th{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
tr.hl td{background:var(--ok);font-weight:700}
.scroll{overflow-x:auto}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">Cc</div><div><h1>Chem cal – Calculator</h1><p>Quick, reliable calculations for formulation &amp; analytical work</p></div></header>

<div class="tabs">
<button class="tab on" data-t="aor">Angle of Repose</button>
<button class="tab" data-t="sol">Solution Preparation</button>
</div>

<!-- ANGLE OF REPOSE -->
<section id="aor" class="card">
<div class="row">
<div><label>Height of powder cone, h</label><input id="h" type="number" step="any" min="0" placeholder="e.g. 2.5"></div>
<div><label>Base measured as</label><select id="bt"><option value="d">Diameter of base</option><option value="r">Radius of base</option></select></div>
</div>
<div class="row">
<div><label id="blab">Diameter of base</label><input id="b" type="number" step="any" min="0" placeholder="e.g. 8"></div>
<div><label>Unit (same for both)</label><select id="u"><option>cm</option><option>mm</option></select></div>
</div>
<button class="go" id="aorGo">Calculate angle of repose</button>
<div class="res" id="aorRes"></div>
<div class="scroll"><table><thead><tr><th>Angle (°)</th><th>Flow property</th></tr></thead><tbody id="aorTbl"></tbody></table></div>
<p class="note">θ = tan⁻¹(h / r). Flow categories follow USP &lt;1174&gt; (Carr / Pharmacopoeial scale).</p>
</section>

<!-- SOLUTION -->
<section id="sol" class="card hide">
<label>What do you want to prepare?</label>
<select id="mode">
<option value="M">Molar solution (M)</option>
<option value="F">Formal solution (F)</option>
<option value="N">Normal solution (N)</option>
<option value="m">Molal solution (m)</option>
<option value="ppm">ppm solution (mg/L)</option>
<option value="pv">% w/v solution</option>
<option value="dil">Dilution (C₁V₁ = C₂V₂)</option>
</select>
<div id="fields"></div>
<button class="go" id="solGo">Calculate</button>
<div class="res" id="solRes"></div>
</section>

<footer>For laboratory guidance. Always verify against your SOP / Certificate of Analysis.</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>{if(!isFinite(n))return"–";const a=Math.abs(n);return a>=1000||a<0.001&&a>0?Number(n.toPrecision(5)).toString():Number(n.toFixed(4)).toString()};

// tabs
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('aor').classList.toggle('hide',t.dataset.t!=='aor');
  $('sol').classList.toggle('hide',t.dataset.t!=='sol');
});

// ---------- Angle of repose ----------
const SCALE=[[25,30,"Excellent"],[31,35,"Good"],[36,40,"Fair (aid not needed)"],[41,45,"Passable (may hang up)"],[46,55,"Poor (must agitate / vibrate)"],[56,65,"Very poor"],[66,90,"Very, very poor"]];
function cat(a){
  if(a<25)return{i:-1,n:"Excellent (below 25° – very free-flowing)"};
  for(let i=0;i<SCALE.length;i++){const s=SCALE[i];const next=SCALE[i+1];
    if(a>=s[0]&&(next?a<next[0]:true))return{i,n:s[2]};}
  return{i:6,n:"Very, very poor"};
}
$('aorTbl').innerHTML=SCALE.map((s,i)=>`<tr id="r${i}"><td>${i==6?'> 66':s[0]+' – '+s[1]}</td><td>${s[2]}</td></tr>`).join('');
$('bt').onchange=()=>$('blab').textContent=$('bt').value==='d'?'Diameter of base':'Radius of base';
$('aorGo').onclick=()=>{
  const h=parseFloat($('h').value),b=parseFloat($('b').value),u=$('u').value;
  const R=$('aorRes');R.style.display='block';
  document.querySelectorAll('#aorTbl tr').forEach(r=>r.classList.remove('hl'));
  if(!(h>0)||!(b>0)){R.innerHTML='<span class="err">Please enter positive values for height and base.</span>';return}
  const r=$('bt').value==='d'?b/2:b;
  const a=Math.atan(h/r)*180/Math.PI;
  const c=cat(a);
  if(c.i>=0)$('r'+c.i).classList.add('hl');
  R.innerHTML=`<div class="big">${a.toFixed(2)}°<span class="tag">${c.n}</span></div>
  <div class="note">tan θ = h / r = ${fmt(h)} ${u} / ${fmt(r)} ${u} = ${(h/r).toFixed(4)}</div>`;
};

// ---------- Solution prep ----------
const volF=`<div class="row"><div><label>Final volume</label><input id="V" type="number" step="any" min="0" placeholder="e.g. 500"></div><div><label>Volume unit</label><select id="Vu"><option value="1">mL</option><option value="1000">L</option></select></div></div>`;
const purF=`<div class="row"><div><label>Purity / assay % (optional)</label><input id="P" type="number" step="any" min="0" max="100" placeholder="100"></div><div><label>Liquid density g/mL (optional)</label><input id="D" type="number" step="any" min="0" placeholder="for liquid reagents"></div></div>`;
const MODES={
M:{f:`<label>Desired molarity (mol/L)</label><input id="C" type="number" step="any" min="0">
<label>Molecular weight (g/mol)</label><input id="W" type="number" step="any" min="0">`+volF+purF},
F:{f:`<label>Desired formality (formula weights per L)</label><input id="C" type="number" step="any" min="0">
<label>Formula weight (g/FW)</label><input id="W" type="number" step="any" min="0">`+volF+purF},
N:{f:`<label>Desired normality (eq/L)</label><input id="C" type="number" step="any" min="0">
<div class="row"><div><label>Molecular weight (g/mol)</label><input id="W" type="number" step="any" min="0"></div><div><label>n-factor (H⁺/OH⁻/e⁻ per mole)</label><input id="n" type="number" step="any" min="0" value="1"></div></div>`+volF+purF},
m:{f:`<label>Desired molality (mol/kg solvent)</label><input id="C" type="number" step="any" min="0">
<label>Molecular weight (g/mol)</label><input id="W" type="number" step="any" min="0">
<div class="row"><div><label>Solvent mass</label><input id="V" type="number" step="any" min="0"></div><div><label>Unit</label><select id="Vu"><option value="1">g</option><option value="1000">kg</option></select></div></div>`+purF},
ppm:{f:`<label>Desired concentration (ppm = mg/L)</label><input id="C" type="number" step="any" min="0">`+volF+`<label>Purity / assay % (optional)</label><input id="P" type="number" step="any" min="0" max="100" placeholder="100">
<p class="note">Tip: for an element standard from a salt, enter the "Fraction of analyte" below (e.g. Na in NaCl = 0.3934).</p>
<label>Fraction of analyte in compound (optional)</label><input id="fr" type="number" step="any" min="0" max="1" placeholder="1">`},
pv:{f:`<label>Desired % w/v (g per 100 mL)</label><input id="C" type="number" step="any" min="0">`+volF+purF},
dil:{f:`<div class="row"><div><label>Stock concentration C₁</label><input id="C1" type="number" step="any" min="0"></div><div><label>Desired concentration C₂</label><input id="C2" type="number" step="any" min="0"></div></div>`+volF+`<p class="note">Use the same concentration unit (M, N, ppm, %…) for C₁ and C₂. Volume entered is the final volume V₂.</p>`}
};
function draw(){$('fields').innerHTML=MODES[$('mode').value].f;$('solRes').style.display='none'}
$('mode').onchange=draw;draw();
const g=id=>{const e=$(id);return e?parseFloat(e.value):NaN};
function show(html){const R=$('solRes');R.style.display='block';R.innerHTML=html}
function err(m){show(`<span class="err">${m}</span>`)}
function massOut(gram,P,D,extra){
  let h=`<div class="big">${fmt(gram)} g</div><div class="note">= ${fmt(gram*1000)} mg</div>`;
  if(P&&P<100)h+=`<div class="note">Corrected for ${P}% purity.</div>`;
  if(D>0)h+=`<div style="margin-top:8px"><b>If the reagent is a liquid:</b> ${fmt(gram/D)} mL (density ${D} g/mL)</div>`;
  h+=extra;
  h+=`<div class="note" style="margin-top:10px"><b>Method:</b> weigh/measure the above, dissolve in part of the solvent, then make up to the final volume in a volumetric flask.</div>`;
  show(h);
}
$('solGo').onclick=()=>{
  const m=$('mode').value;
  if(m==='dil'){
    const C1=g('C1'),C2=g('C2'),V2=g('V')*parseFloat($('Vu').value);
    if(!(C1>0&&C2>0&&V2>0))return err('Enter C₁, C₂ and final volume.');
    if(C2>C1)return err('Desired concentration cannot exceed stock concentration.');
    const V1=C2*V2/C1;
    return show(`<div class="big">${fmt(V1)} mL of stock</div><div class="note">V₁ = C₂V₂ / C₁ = ${fmt(C2)} × ${fmt(V2)} / ${fmt(C1)}</div><div class="note" style="margin-top:8px">Add diluent (solvent) ${fmt(V2-V1)} mL to make ${fmt(V2)} mL.</div>`);
  }
  const C=g('C');if(!(C>0))return err('Enter the desired concentration.');
  let P=g('P');if(!(P>0))P=100;
  const D=g('D');
  const Vraw=g('V')*parseFloat($('Vu').value);
  if(!(Vraw>0))return err('Enter the volume / solvent amount.');
  const pf=100/P;
  if(m==='ppm'){
    let fr=g('fr');if(!(fr>0))fr=1;
    const mg=C*(Vraw/1000)/fr*pf;
    return show(`<div class="big">${fmt(mg)} mg</div><div class="note">= ${fmt(mg/1000)} g</div><div class="note">mass (mg) = ppm × V(L) ${fr!==1?'÷ fraction ':''}${P<100?'÷ purity ':''}</div><div class="note" style="margin-top:10px"><b>Method:</b> dissolve in a little solvent and make up to ${fmt(Vraw)} mL.</div>`);
  }
  if(m==='pv'){
    const gm=C*Vraw/100*pf;
    return massOut(gm,P,D,`<div class="note">mass = % × V(mL) / 100</div>`);
  }
  const W=g('W');if(!(W>0))return err('Enter the molecular / formula weight.');
  if(m==='M'||m==='F'){
    const gm=C*W*(Vraw/1000)*pf;
    return massOut(gm,P,D,`<div class="note">mass = ${m} × MW × V(L) = ${fmt(C)} × ${fmt(W)} × ${fmt(Vraw/1000)}</div>`);
  }
  if(m==='N'){
    const n=g('n');if(!(n>0))return err('Enter the n-factor.');
    const eq=W/n,gm=C*eq*(Vraw/1000)*pf;
    return massOut(gm,P,D,`<div class="note">Equivalent weight = MW / n = ${fmt(eq)} g/eq<br>mass = N × Eq.wt × V(L)</div>`);
  }
  if(m==='m'){
    const gm=C*W*(Vraw/1000)*pf;
    return massOut(gm,P,0,`<div class="note">mass = molality × MW × solvent(kg) = ${fmt(C)} × ${fmt(W)} × ${fmt(Vraw/1000)}<br>Dissolve in exactly ${fmt(Vraw)} g solvent (weigh the solvent; no volumetric flask needed).</div>`);
  }
};
</script>
</body>
</html>
